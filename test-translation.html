<!DOCTYPE html>
<html>
<head>
    <title>Translation Test</title>
</head>
<body>
    <h1>Google Translate API Test</h1>
    <div id="result">Testing...</div>
    
    <script>
        // Google Translate Configuration
        const GOOGLE_TRANSLATE_API_KEY = 'AIzaSyC-KeQ39iD_HAwGVbQt830FP8EzEY7Ez5s';
        const GOOGLE_TRANSLATE_ENDPOINT = 'https://translation.googleapis.com/language/translate/v2';

        async function testTranslation() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '🧪 Testing Google Translate API...';
            
            try {
                const url = `${GOOGLE_TRANSLATE_ENDPOINT}?key=${GOOGLE_TRANSLATE_API_KEY}`;
                
                const requestBody = {
                    q: 'Hello world',
                    target: 'es',
                    format: 'text'
                };

                console.log('📦 Request URL:', url);
                console.log('📦 Request Body:', requestBody);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody)
                });

                console.log('📡 Response Status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API Error: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                console.log('📥 Response Data:', data);

                if (data && data.data && data.data.translations && data.data.translations[0]) {
                    const translatedText = data.data.translations[0].translatedText;
                    resultDiv.innerHTML = `
                        <h2>✅ Success!</h2>
                        <p><strong>Original:</strong> Hello world</p>
                        <p><strong>Translated:</strong> ${translatedText}</p>
                        <p><strong>Language:</strong> Spanish (es)</p>
                    `;
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `
                    <h2>❌ Error</h2>
                    <p>${error.message}</p>
                    <p>Check the console for more details.</p>
                `;
            }
        }

        // Run test when page loads
        window.addEventListener('load', testTranslation);
    </script>
</body>
</html>
